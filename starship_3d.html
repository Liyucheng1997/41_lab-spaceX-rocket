<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starship 3D · 发射与筷子回收</title>
<style>
  body{margin:0;background:#05070d;font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px;}
  #wrap{width:100%;max-width:760px;}
  #stage{position:relative;width:100%;height:520px;border-radius:14px;overflow:hidden;border:1px solid rgba(80,140,220,0.25);background:#05070d;}
  #stage canvas{display:block;width:100%;height:100%;}
  .hud{position:absolute;font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none;}
  .card{background:rgba(8,16,30,0.72);border:1px solid rgba(90,160,230,0.3);border-radius:8px;padding:7px 10px;backdrop-filter:blur(3px);}
  .lbl{color:#6f87a3;font-size:9px;letter-spacing:1px;}
  .bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;overflow:hidden;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div class="hud" style="top:12px;left:14px;color:#7fd4ff;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 0 8px rgba(40,140,255,0.6);" id="d-phase">待命 · STANDBY</div>
    <div class="hud" style="top:12px;right:14px;color:#dfeaf5;font-size:14px;letter-spacing:1px;" id="d-clock">T- 00:10</div>
    <div class="hud" style="left:12px;bottom:12px;display:flex;gap:8px;">
      <div class="card" style="min-width:74px;"><div class="lbl">ALTITUDE</div><div id="d-alt" style="color:#7fffb0;font-size:16px;">0.0<span style="font-size:9px;color:#6f87a3"> km</span></div></div>
      <div class="card" style="min-width:88px;"><div class="lbl">VELOCITY</div><div id="d-vel" style="color:#7fd4ff;font-size:16px;">0<span style="font-size:9px;color:#6f87a3"> km/h</span></div></div>
      <div class="card" style="min-width:62px;"><div class="lbl">ENGINES</div><div id="d-eng" style="color:#ffd47f;font-size:16px;">0<span style="font-size:9px;color:#6f87a3">/33</span></div></div>
    </div>
    <div class="hud" style="right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;width:150px;">
      <div class="card"><div style="display:flex;justify-content:space-between;" class="lbl"><span>B · 超重型助推</span><span id="d-f1t">100%</span></div><div class="bar"><div id="d-f1" style="height:100%;width:100%;background:linear-gradient(90deg,#1d9e75,#7fffb0);"></div></div></div>
      <div class="card"><div style="display:flex;justify-content:space-between;" class="lbl"><span>S · 星舰飞船</span><span id="d-f2t">100%</span></div><div class="bar"><div id="d-f2" style="height:100%;width:100%;background:linear-gradient(90deg,#185fa5,#7fd4ff);"></div></div></div>
    </div>
    <div class="hud" style="left:50%;transform:translateX(-50%);bottom:10px;color:#56708c;font-size:10px;">拖动旋转 · 滚轮缩放</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;">
    <button id="d-launch" style="background:#d83a30;color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;box-shadow:0 0 18px rgba(216,58,48,0.45);">点火发射</button>
    <button id="d-reset" style="background:transparent;color:#9fb4cc;border:1px solid rgba(120,160,210,0.4);border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;">复位</button>
    <div style="display:flex;align-items:center;gap:6px;color:#8aa0bb;font-size:12px;font-family:ui-monospace,monospace;margin-left:4px;">镜头<button id="d-cam" style="background:rgba(20,40,70,0.6);color:#7fd4ff;border:1px solid rgba(90,160,230,0.4);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;">跟随助推器</button></div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto;color:#8aa0bb;font-size:12px;font-family:ui-monospace,monospace;">速度 <input id="d-speed" type="range" min="0.5" max="3" step="0.5" value="1" style="width:96px;"> <span id="d-speedv" style="color:#dfeaf5;">1.0x</span></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  function boot(){ if(!window.THREE) return setTimeout(boot,80);
  const stage=document.getElementById('stage'), el=id=>document.getElementById(id);
  const G=9.8, CATCH=90, WS=0.9;
  let speed=1, camTgt='booster';

  // ---------- renderer / scene ----------
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement); renderer.domElement.style.cssText='display:block;width:100%;height:100%;';
  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x9fc4e8,800,6000);
  const camera=new THREE.PerspectiveCamera(46,1,0.5,80000);

  // ---------- environment map (gives steel real reflections) ----------
  function envTexture(){
    const c=document.createElement('canvas'); c.width=1024; c.height=512; const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#0a1430'); g.addColorStop(0.45,'#3f74c0'); g.addColorStop(0.52,'#bcd6f0');
    g.addColorStop(0.54,'#7d8a73'); g.addColorStop(1,'#1a2414');
    x.fillStyle=g; x.fillRect(0,0,1024,512);
    // sun glow
    const sg=x.createRadialGradient(300,150,0,300,150,180); sg.addColorStop(0,'rgba(255,250,235,1)'); sg.addColorStop(1,'rgba(255,250,235,0)');
    x.fillStyle=sg; x.fillRect(0,0,1024,512);
    const t=new THREE.CanvasTexture(c); t.mapping=THREE.EquirectangularReflectionMapping; t.encoding=THREE.sRGBEncoding; return t;
  }
  const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
  const envRT=pmrem.fromEquirectangular(envTexture()); scene.environment=envRT.texture;

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xbfd8ff,0x39402f,0.5));
  const sun=new THREE.DirectionalLight(0xfff4e6,2.0); sun.position.set(400,820,520);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=10; sun.shadow.camera.far=2600;
  sun.shadow.camera.left=-360; sun.shadow.camera.right=360; sun.shadow.camera.top=360; sun.shadow.camera.bottom=-360;
  sun.shadow.bias=-0.0003; scene.add(sun);
  const rim=new THREE.DirectionalLight(0x4d7dff,0.7); rim.position.set(-500,300,-400); scene.add(rim);

  // ---------- ground / pad ----------
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(60000,60000),
    new THREE.MeshStandardMaterial({color:0x2b3322,roughness:0.95,metalness:0}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(24,26,7,40),
    new THREE.MeshStandardMaterial({color:0x4a4f57,roughness:0.85,metalness:0.4}));
  pad.position.y=3.5; pad.receiveShadow=true; pad.castShadow=true; scene.add(pad);

  // ---------- stars ----------
  const sg2=new THREE.BufferGeometry(),sp=[];
  for(let i=0;i<1800;i++){const r=22000,u=Math.random(),v=Math.random();const th=2*Math.PI*u,ph=Math.acos(2*v-1);
    sp.push(r*Math.sin(ph)*Math.cos(th),Math.abs(r*Math.cos(ph)),r*Math.sin(ph)*Math.sin(th));}
  sg2.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  const stars=new THREE.Points(sg2,new THREE.PointsMaterial({color:0xffffff,size:46,sizeAttenuation:true,transparent:true,opacity:0})); scene.add(stars);

  // ---------- materials ----------
  const steel=new THREE.MeshStandardMaterial({color:0xb8c0c8,metalness:1.0,roughness:0.28,envMapIntensity:1.25});
  const steelSeam=new THREE.MeshStandardMaterial({color:0x7c848d,metalness:1.0,roughness:0.45,envMapIntensity:0.9});
  const steelDark=new THREE.MeshStandardMaterial({color:0x6f777f,metalness:1.0,roughness:0.4,envMapIntensity:1.0});
  const tile=new THREE.MeshStandardMaterial({color:0x111317,metalness:0.1,roughness:0.92,envMapIntensity:0.3});
  const nozzle=new THREE.MeshStandardMaterial({color:0x3a3d42,metalness:1.0,roughness:0.5,envMapIntensity:0.8});
  const towerMat=new THREE.MeshStandardMaterial({color:0x9aa0a8,metalness:0.85,roughness:0.5,envMapIntensity:1.0});

  // ---------- sprite textures ----------
  function radialTex(stops){ const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
    const g=x.createRadialGradient(64,64,0,64,64,64); stops.forEach(s=>g.addColorStop(s[0],s[1])); x.fillStyle=g; x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c); }
  const glowTex=radialTex([[0,'rgba(180,220,255,0.95)'],[0.3,'rgba(120,170,255,0.5)'],[1,'rgba(80,120,255,0)']]);
  const smokeTex=radialTex([[0,'rgba(225,228,232,0.9)'],[0.5,'rgba(190,196,204,0.5)'],[1,'rgba(170,176,184,0)']]);

  // ---------- engine flame cluster ----------
  function makeFlames(rings,R,flameLen){
    const grp=new THREE.Group(),units=[];
    const coreMat=()=>new THREE.MeshBasicMaterial({color:0xdfeeff,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false});
    const outMat=()=>new THREE.MeshBasicMaterial({color:0x4f8bff,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false});
    rings.forEach(rd=>{for(let i=0;i<rd.n;i++){const a=(i/rd.n)*Math.PI*2+(rd.off||0);
      const u=new THREE.Group(); u.position.set(Math.cos(a)*rd.r*R,0,Math.sin(a)*rd.r*R);
      const outer=new THREE.Mesh(new THREE.ConeGeometry(R*0.16,flameLen,12),outMat()); outer.position.y=-flameLen*0.5; outer.rotation.x=Math.PI; u.add(outer);
      const core=new THREE.Mesh(new THREE.ConeGeometry(R*0.085,flameLen*0.7,12),coreMat()); core.position.y=-flameLen*0.35; core.rotation.x=Math.PI; u.add(core);
      // mach diamonds
      for(let d=0;d<3;d++){const m=new THREE.Mesh(new THREE.SphereGeometry(R*0.05,8,8),coreMat()); m.position.y=-flameLen*(0.18+d*0.16); u.add(m);}
      const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false}));
      gl.scale.set(R*1.4,R*1.4,1); gl.position.y=-flameLen*0.1; u.add(gl);
      grp.add(u); units.push({u,outer,core,gl}); }});
    const pl=new THREE.PointLight(0xff7a2a,0,700,2); pl.position.y=-flameLen*0.3; grp.add(pl);
    const pl2=new THREE.PointLight(0x8fc0ff,0,460,2); pl2.position.y=-flameLen*0.7; grp.add(pl2);
    grp.update=(thr,lit,t)=>{ const fl=0.8+0.2*Math.sin(t*42);
      units.forEach((o,idx)=>{const on=idx<lit&&thr>0.02; o.u.visible=on;
        if(on){const s=(0.5+thr*1.6)*fl; o.u.scale.set(1,s,1); o.outer.material.opacity=0.35+0.4*thr; o.core.material.opacity=0.7+0.3*thr; o.gl.material.opacity=0.4+0.5*thr;}});
      pl.intensity=thr*5*(lit>10?1:0.5); pl2.intensity=thr*3.4*(lit>10?1:0.6); };
    return grp;
  }

  // ---------- seam rings (Starship weld bands) ----------
  function addSeams(grp,R,h0,h1,step){ for(let y=h0;y<=h1;y+=step){
    const r=new THREE.Mesh(new THREE.CylinderGeometry(R*1.004,R*1.004,0.22,40,1,true),steelSeam); r.position.y=y; grp.add(r); } }

  // ---------- booster (Super Heavy) ----------
  const Hb=70,Rb=4.5;
  const booster=new THREE.Group();
  (function(){
    const body=new THREE.Mesh(new THREE.CylinderGeometry(Rb,Rb,Hb,48,1,true),steel); body.position.y=Hb/2; body.castShadow=true; booster.add(body);
    addSeams(booster,Rb,Hb*0.08,Hb*0.92,Hb/16);
    const skirt=new THREE.Mesh(new THREE.CylinderGeometry(Rb,Rb*0.94,Hb*0.06,48),steelDark); skirt.position.y=Hb*0.03; booster.add(skirt);
    // raptor nozzles (visible bells) 3/10/20
    [{n:3,r:0.16},{n:10,r:0.52},{n:20,r:0.86}].forEach(rd=>{for(let i=0;i<rd.n;i++){const a=(i/rd.n)*Math.PI*2;
      const b=new THREE.Mesh(new THREE.CylinderGeometry(Rb*0.075,Rb*0.11,Hb*0.05,12),nozzle);
      b.position.set(Math.cos(a)*rd.r*Rb,-Hb*0.005,Math.sin(a)*rd.r*Rb); booster.add(b);}});
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(Rb,Rb,Hb*0.06,48,1,true),steelDark); ring.position.y=Hb*0.97; booster.add(ring); booster.ring=ring; ring.visible=false;
    const fins=[]; for(let i=0;i<4;i++){const fg=new THREE.Group();
      const blade=new THREE.Mesh(new THREE.BoxGeometry(Rb*0.95,Hb*0.06,0.5),steelDark);
      const frame=new THREE.Mesh(new THREE.BoxGeometry(Rb*1.0,Hb*0.065,0.7),steelSeam); frame.position.z=-0.1;
      fg.add(frame); fg.add(blade);
      const a=i*Math.PI/2; fg.position.set(Math.cos(a)*(Rb+Rb*0.5),Hb*0.88,Math.sin(a)*(Rb+Rb*0.5)); fg.rotation.y=-a; booster.add(fg); fins.push(fg);}
    booster.fins=fins;
    for(let i=0;i<2;i++){const a=i*Math.PI;const p=new THREE.Mesh(new THREE.BoxGeometry(1.4,3,2.4),nozzle); p.position.set(Math.cos(a)*(Rb+0.4),Hb*0.8,Math.sin(a)*(Rb+0.4)); booster.add(p);}
    const fl=makeFlames([{n:3,r:0.16},{n:10,r:0.52},{n:20,r:0.86}],Rb,30); fl.position.y=-Hb*0.02; booster.add(fl); booster.flames=fl;
  })();
  scene.add(booster);

  // ---------- ship (Starship) ----------
  const Hs=50,Rs=4.5,Nose=14;
  const ship=new THREE.Group();
  (function(){
    const body=new THREE.Mesh(new THREE.CylinderGeometry(Rs,Rs,Hs,48,1,true),steel); body.position.y=Hs/2; body.castShadow=true; ship.add(body);
    addSeams(ship,Rs,Hs*0.1,Hs*0.95,Hs/12);
    const nose=new THREE.Mesh(new THREE.CylinderGeometry(0.4,Rs,Nose,48,1,true),steel); nose.position.y=Hs+Nose/2-0.5; ship.add(nose);
    const tip=new THREE.Mesh(new THREE.SphereGeometry(0.6,16,12),steel); tip.position.y=Hs+Nose-0.5; ship.add(tip);
    const tm=new THREE.Mesh(new THREE.CylinderGeometry(Rs+0.06,Rs+0.06,Hs*0.92,48,1,true,Math.PI*0.2,Math.PI*1.05),tile); tm.position.y=Hs*0.48; ship.add(tm);
    const fl=(w,h,y,x,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,1.0),steelDark); m.position.set(x,y,z||0); m.castShadow=true; ship.add(m);};
    fl(Rs*0.85,Hs*0.18,Hs*0.86,Rs+Rs*0.42); fl(Rs*0.85,Hs*0.18,Hs*0.86,-(Rs+Rs*0.42));
    fl(Rs*1.0,Hs*0.22,Hs*0.12,Rs+Rs*0.5); fl(Rs*1.0,Hs*0.22,Hs*0.12,-(Rs+Rs*0.5));
    const flm=makeFlames([{n:3,r:0.18},{n:3,r:0.55}],Rs,16); ship.add(flm); ship.flames=flm;
  })();
  scene.add(ship);

  // ---------- Mechazilla tower (lattice) + chopstick arms ----------
  const towerX=-Rb-17,armY=CATCH*WS+Hb*0.8,Htw=armY+34;
  const tower=new THREE.Group(); tower.position.set(towerX,0,0);
  (function(){
    const s=4.5; // half-width
    const leg=(x,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(0.9,Htw,0.9),towerMat); m.position.set(x,Htw/2,z); m.castShadow=true; tower.add(m);};
    leg(-s,-s);leg(s,-s);leg(-s,s);leg(s,s);
    for(let y=6;y<Htw;y+=7){ // horizontal + diagonal braces (4 faces)
      [[-s,-s,s,-s],[s,-s,s,s],[s,s,-s,s],[-s,s,-s,-s]].forEach(e=>{
        const ax=(e[0]+e[2])/2,az=(e[1]+e[3])/2,len=Math.hypot(e[2]-e[0],e[3]-e[1]);
        const hb=new THREE.Mesh(new THREE.BoxGeometry(len,0.4,0.4),towerMat); hb.position.set(ax,y,az);
        hb.rotation.y=Math.atan2(-(e[3]-e[1]),(e[2]-e[0])); tower.add(hb);
        const db=new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(len,7),0.3,0.3),towerMat); db.position.set(ax,y+3.5,az);
        db.rotation.y=hb.rotation.y; db.rotation.z=Math.atan2(7,len); tower.add(db); }); }
    const carriage=new THREE.Mesh(new THREE.BoxGeometry(s*2+2,9,s*2+2),steelDark); carriage.position.y=armY; carriage.castShadow=true; tower.add(carriage);
    const armLen=(0-towerX)+Rb+4;
    function arm(z){const g=new THREE.Group(); g.position.set(s,armY,z);
      const beam=new THREE.Mesh(new THREE.BoxGeometry(armLen,3.2,2.6),towerMat); beam.position.x=armLen/2; beam.castShadow=true; g.add(beam);
      const rail=new THREE.Mesh(new THREE.BoxGeometry(armLen*0.8,1.2,1.4),steelDark); rail.position.set(armLen*0.55,1.8,0); g.add(rail);
      const cup=new THREE.Mesh(new THREE.BoxGeometry(3.2,5.5,3.4),steelDark); cup.position.x=armLen; g.add(cup);
      tower.add(g); return g;}
    tower.armA=arm(Rb+0.8); tower.armB=arm(-(Rb+0.8));
    // quick-disconnect arm lower down
    const qd=new THREE.Mesh(new THREE.BoxGeometry(armLen*0.7,2.4,2),towerMat); qd.position.set(s+armLen*0.35,Hb*0.5,0); tower.add(qd);
  })();
  scene.add(tower);
  function setArms(close){const ang=0.62*(1-close); tower.armA.rotation.y=-ang; tower.armB.rotation.y=ang;}

  // ---------- smoke particles ----------
  const smoke=[]; const SMAX=90;
  for(let i=0;i<SMAX;i++){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,transparent:true,opacity:0,depthWrite:false}));
    s.visible=false; scene.add(s); smoke.push({s,life:0,max:1,vx:0,vy:0,vz:0,sc:1}); }
  let smPtr=0;
  function emitSmoke(x,y,z,n){ for(let k=0;k<n;k++){ const p=smoke[smPtr++%SMAX];
    p.life=0; p.max=1.4+Math.random()*1.6; p.sc=8+Math.random()*10;
    const a=Math.random()*Math.PI*2, sp2=14+Math.random()*22;
    p.vx=Math.cos(a)*sp2; p.vz=Math.sin(a)*sp2; p.vy=6+Math.random()*10;
    p.s.position.set(x+Math.cos(a)*6,y+2,z+Math.sin(a)*6); p.s.visible=true; p.s.material.opacity=0.7; p.s.scale.set(p.sc,p.sc,1); } }
  function updateSmoke(dt){ for(const p of smoke){ if(!p.s.visible)continue; p.life+=dt;
    const f=p.life/p.max; if(f>=1){p.s.visible=false;continue;}
    p.s.position.x+=p.vx*dt; p.s.position.y+=p.vy*dt; p.s.position.z+=p.vz*dt; p.vy*=0.98;
    const sc=p.sc*(1+f*2.4); p.s.scale.set(sc,sc,1); p.s.material.opacity=0.7*(1-f); } }

  // ---------- orbit camera ----------
  let az=-0.55,pol=1.28,dist=210,userDist=210,drag=false,px=0,py=0;
  const cvEl=renderer.domElement;
  cvEl.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;cvEl.setPointerCapture(e.pointerId);});
  cvEl.addEventListener('pointerup',()=>{drag=false;});
  cvEl.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-px)*0.006;pol-=(e.clientY-py)*0.006;pol=Math.max(0.2,Math.min(1.5,pol));px=e.clientX;py=e.clientY;});
  cvEl.addEventListener('wheel',e=>{e.preventDefault();userDist*=(1+Math.sign(e.deltaY)*0.12);userDist=Math.max(55,Math.min(1100,userDist));},{passive:false});

  // ---------- flight state ----------
  let S;
  function reset(){S={t:0,phase:'standby',flagQ:false,sep:false,alt:0,vy:0,dr:0,vx:0,tilt:0,tTilt:0,fins:0,thr:0,f1:100,eng:0,
    ship:{active:false,alt:0,vy:0,dr:0,vx:0,tilt:0,thr:0,f2:100},arm:0,apex:0,ignT:0}; booster.ring.visible=false;
    el('d-launch').disabled=false; el('d-launch').textContent='点火发射'; el('d-launch').style.opacity=1;}
  function launch(){if(S.phase!=='standby')return;S.phase='ignition';S.t=0;S.ignT=0;
    el('d-launch').disabled=true;el('d-launch').style.opacity=0.45;el('d-launch').textContent='飞行中…';}
  el('d-launch').onclick=launch; el('d-reset').onclick=()=>reset();
  el('d-cam').onclick=()=>{camTgt=(camTgt==='booster')?'ship':'booster';el('d-cam').textContent=camTgt==='booster'?'跟随助推器':'跟随飞船';};
  el('d-speed').oninput=e=>{speed=parseFloat(e.target.value);el('d-speedv').textContent=speed.toFixed(1)+'x';};

  function step(dt){const p=S.phase; if(p==='standby'||p==='landed')return; S.t+=dt;
    if(p==='ignition'){S.ignT+=dt;S.thr=Math.min(1,S.ignT/1.4);S.eng=Math.round(S.thr*33);S.alt=0;S.vy=0;if(S.ignT>=1.4)S.phase='ascent';}
    else if(p==='ascent'){S.thr=1;S.eng=33;S.f1-=dt*3.6;S.tTilt=Math.min(0.32,S.alt/2600);const A=23;S.vy+=(A-G)*dt;S.vx+=A*Math.sin(S.tilt)*dt;if(S.vy>175||S.f1<42){S.phase='hotstage';S.t2=0;}}
    else if(p==='hotstage'){S.t2=(S.t2||0)+dt;S.eng=3;S.thr=0.18;S.vy+=-G*dt;S.fins=Math.min(1,S.t2/0.8);
      if(!S.ship.active){S.ship.active=true;S.ship.alt=S.alt+Hb*0.5;S.ship.vy=S.vy;S.ship.dr=S.dr;S.ship.vx=S.vx;}
      if(S.t2>=0.8){S.sep=true;booster.ring.visible=true;S.phase='boostback';S.t3=0;}}
    else if(p==='boostback'){S.t3=(S.t3||0)+dt;S.fins=1;S.tTilt=0.5;S.thr=(S.t3<2.4)?0.55:0;S.eng=(S.t3<2.4)?13:0;S.f1-=(S.t3<2.4?dt*2.8:0);S.vy+=-G*dt;S.vx=0;S.dr+=(0-S.dr)*Math.min(1,dt*1.0);if(S.t3>=2.8){S.phase='coast';S.tTilt=0;}}
    else if(p==='coast'){S.fins=1;S.thr=0;S.eng=0;S.tTilt=0;S.vy+=-G*dt;S.vx=0;S.dr+=(0-S.dr)*Math.min(1,dt*1.3);if(S.vy<0&&S.alt<S.apex*0.5&&S.alt>0){S.phase='reentry';S.t4=0;}}
    else if(p==='reentry'){S.t4=(S.t4||0)+dt;S.thr=(S.t4<1.4)?0.7:0;S.eng=(S.t4<1.4)?13:0;S.f1-=(S.t4<1.4?dt*2.0:0);S.vy+=(-G+(S.t4<1.4?28:0))*dt;S.vx=0;S.dr+=(0-S.dr)*Math.min(1,dt*1.6);if(S.t4>=1.4)S.phase='descent';}
    else if(p==='descent'){S.thr=0;S.eng=0;S.fins=1;S.vy+=-G*dt;S.vx=0;S.dr+=(0-S.dr)*Math.min(1,dt*2.0);const net=40-G,stop=(S.vy*S.vy)/(2*net);if((S.alt-CATCH)<=stop*1.05)S.phase='landingburn';}
    else if(p==='landingburn'){S.eng=3;const net=40-G,h=Math.max(S.alt-CATCH,0.5);let need=Math.min((S.vy*S.vy)/(2*h),net);S.thr=Math.min(1,(need+G)/40);S.f1-=dt*3.0;S.vy+=need*dt;if(S.vy>0)S.vy=0;S.vx=0;S.dr+=(0-S.dr)*Math.min(1,dt*3.0);if(S.alt<=CATCH+0.8&&S.vy>-3){S.alt=CATCH;S.vy=0;S.dr=0;S.phase='catch';S.t5=0;}}
    else if(p==='catch'){S.t5=(S.t5||0)+dt;S.alt=CATCH;S.vy=0;S.dr=0;S.thr=Math.max(0,0.5-S.t5);S.eng=S.thr>0.05?3:0;S.arm=Math.min(1,S.t5/1.3);if(S.arm>=1)S.phase='landed';}
    if(p!=='ignition'){S.alt=Math.max(0,S.alt+S.vy*dt);S.dr+=S.vx*dt;}
    S.apex=Math.max(S.apex,S.alt);S.tilt+=(S.tTilt-S.tilt)*Math.min(1,dt*2.5);
    if(!S.flagQ&&S.alt>180&&p==='ascent')S.flagQ=true;
    const sh=S.ship;
    if(sh.active&&p!=='landed'){sh.thr=1;sh.tilt=Math.min(0.6,sh.alt/4000);
      if(sh.f2>0){const A2=18;sh.vy+=(A2-G)*dt;sh.f2-=dt*1.1;sh.vx+=A2*Math.sin(sh.tilt)*dt;}else{sh.thr=0;sh.vy+=-G*0.15*dt;}
      sh.alt=Math.max(0,sh.alt+sh.vy*dt);sh.dr+=sh.vx*dt;}}

  let smokeAcc=0;
  function syncMeshes(t,dt){
    booster.position.set(S.dr*WS,S.alt*WS,0); booster.rotation.z=S.tilt; booster.flames.update(S.thr,S.eng,t);
    booster.fins.forEach(f=>{f.scale.x=0.45+0.55*S.fins;});
    ship.visible=S.ship.active;
    if(S.ship.active){ship.position.set(S.ship.dr*WS,S.ship.alt*WS,0);ship.rotation.z=S.ship.tilt;ship.flames.update(S.ship.thr,6,t);}
    setArms(S.arm);
    // smoke at low-altitude high-thrust (liftoff) or catch
    const lowFire=(S.thr>0.3&&S.alt<260)||(S.phase==='landingburn'&&S.alt<CATCH+120)||S.phase==='catch';
    if(lowFire){ smokeAcc+=dt*speed; const want=(S.alt<40?3:1.4); while(smokeAcc>0.04){smokeAcc-=0.04; emitSmoke(S.dr*WS,Math.max(2,(S.alt-Hb*0.05)*WS),0,want);} }
    updateSmoke(dt*speed);
    const a=Math.min(1,(camTgt==='ship'&&S.ship.active?S.ship.alt:S.alt)/2600);const c=(x,y)=>Math.round(x+(y-x)*a);
    scene.background=new THREE.Color(`rgb(${c(150,3)},${c(192,5)},${c(232,14)})`);scene.fog.color=scene.background;scene.fog.far=800+a*11000;
    stars.material.opacity=Math.max(0,a-0.15)*1.1; sun.intensity=2.0-a*0.8;
  }

  const names={standby:'待命 · STANDBY',ignition:'点火 · IGNITION',ascent:'上升 · ASCENT',hotstage:'热分离 · HOT-STAGING',boostback:'返场点火 · BOOSTBACK',coast:'滑行 · COAST',reentry:'再入点火 · RE-ENTRY',descent:'下降 · DESCENT',landingburn:'着陆点火 · LANDING BURN',catch:'机械臂捕获 · CATCH',landed:'已被筷子夹住 · CAUGHT'};
  function fmtClock(){if(S.phase==='standby')return'T- 00:10';const mt=S.t*7,m=Math.floor(mt/60),s=Math.floor(mt%60);return'T+ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
  function updateHUD(){let lab=names[S.phase]||S.phase;if(S.flagQ&&S.phase==='ascent'&&S.alt<440)lab='最大动压 · MAX-Q';
    el('d-phase').textContent=lab;el('d-phase').style.color=S.phase==='landed'?'#7fffb0':'#7fd4ff';el('d-clock').textContent=fmtClock();
    const e=(camTgt==='ship'&&S.ship.active)?S.ship:S;
    el('d-alt').innerHTML=(e.alt/1000*70).toFixed(1)+'<span style="font-size:9px;color:#6f87a3"> km</span>';
    el('d-vel').innerHTML=Math.round(Math.sqrt(e.vy*e.vy+(e.vx||0)*(e.vx||0))*52).toLocaleString()+'<span style="font-size:9px;color:#6f87a3"> km/h</span>';
    el('d-eng').innerHTML=(camTgt==='ship'?(S.ship.thr>0.05?6:0):S.eng)+'<span style="font-size:9px;color:#6f87a3">/'+(camTgt==='ship'?'6':'33')+'</span>';
    const f1=Math.max(0,S.f1),f2=Math.max(0,S.ship.f2);el('d-f1').style.width=f1+'%';el('d-f1t').textContent=Math.round(f1)+'%';el('d-f2').style.width=f2+'%';el('d-f2t').textContent=Math.round(f2)+'%';}

  function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize);

  const tgt=new THREE.Vector3(),camPos=new THREE.Vector3();let last=performance.now();
  function frame(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;const sdt=dt*speed;
    for(let i=0;i<3;i++)step(sdt/3); syncMeshes(now/1000,dt); updateHUD();
    const e=(camTgt==='ship'&&S.ship.active)?ship:booster;const bodyH=(e===booster?Hb:Hs)*WS;
    tgt.set(e.position.x,e.position.y+bodyH*0.5,e.position.z);dist+=(userDist-dist)*0.1;
    camPos.set(tgt.x+dist*Math.sin(pol)*Math.cos(az),tgt.y+dist*Math.cos(pol),tgt.z+dist*Math.sin(pol)*Math.sin(az));
    camera.position.copy(camPos);camera.lookAt(tgt);renderer.render(scene,camera);requestAnimationFrame(frame);}
  reset();resize();requestAnimationFrame(frame);
  }
  boot();
})();
</script>
