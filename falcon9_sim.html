<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon 9 · 发射与回收模拟</title>
<style>
  body{margin:0;background:#05070d;font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:16px;}
  #wrap{width:100%;max-width:720px;}
</style>
</head>
<body>
<div id="wrap">
<!--FRAGMENT-->
<div style="display:flex;flex-direction:column;gap:10px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;">
  <div style="position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(80,140,220,0.25);background:#05070d;">
    <canvas id="rk-canvas" width="680" height="470" style="display:block;width:100%;height:auto;background:#05070d;"></canvas>

    <div id="rk-phase" style="position:absolute;top:12px;left:14px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#7fd4ff;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 0 8px rgba(40,140,255,0.6);">待命 · STANDBY</div>
    <div id="rk-clock" style="position:absolute;top:12px;right:14px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#dfeaf5;font-size:14px;letter-spacing:1px;">T- 00:03</div>

    <div style="position:absolute;left:12px;bottom:12px;display:flex;gap:8px;font-family:ui-monospace,Menlo,Consolas,monospace;">
      <div style="background:rgba(8,16,30,0.72);border:1px solid rgba(90,160,230,0.3);border-radius:8px;padding:7px 10px;min-width:78px;">
        <div style="color:#6f87a3;font-size:9px;letter-spacing:1px;">ALTITUDE</div>
        <div id="rk-alt" style="color:#7fffb0;font-size:16px;">0.0<span style="font-size:9px;color:#6f87a3"> km</span></div>
      </div>
      <div style="background:rgba(8,16,30,0.72);border:1px solid rgba(90,160,230,0.3);border-radius:8px;padding:7px 10px;min-width:88px;">
        <div style="color:#6f87a3;font-size:9px;letter-spacing:1px;">VELOCITY</div>
        <div id="rk-vel" style="color:#7fd4ff;font-size:16px;">0<span style="font-size:9px;color:#6f87a3"> km/h</span></div>
      </div>
      <div style="background:rgba(8,16,30,0.72);border:1px solid rgba(90,160,230,0.3);border-radius:8px;padding:7px 10px;min-width:78px;">
        <div style="color:#6f87a3;font-size:9px;letter-spacing:1px;">DOWNRANGE</div>
        <div id="rk-dr" style="color:#ffd47f;font-size:16px;">0<span style="font-size:9px;color:#6f87a3"> km</span></div>
      </div>
    </div>

    <div style="position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;width:150px;font-family:ui-monospace,Menlo,Consolas,monospace;">
      <div style="background:rgba(8,16,30,0.72);border:1px solid rgba(90,160,230,0.3);border-radius:8px;padding:6px 9px;">
        <div style="display:flex;justify-content:space-between;color:#6f87a3;font-size:9px;letter-spacing:1px;"><span>S1 · 助推器</span><span id="rk-f1t">100%</span></div>
        <div style="height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;overflow:hidden;"><div id="rk-f1" style="height:100%;width:100%;background:linear-gradient(90deg,#1d9e75,#7fffb0);"></div></div>
      </div>
      <div style="background:rgba(8,16,30,0.72);border:1px solid rgba(90,160,230,0.3);border-radius:8px;padding:6px 9px;">
        <div style="display:flex;justify-content:space-between;color:#6f87a3;font-size:9px;letter-spacing:1px;"><span>S2 · 二级</span><span id="rk-f2t">100%</span></div>
        <div style="height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;overflow:hidden;"><div id="rk-f2" style="height:100%;width:100%;background:linear-gradient(90deg,#185fa5,#7fd4ff);"></div></div>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;">
    <button id="rk-launch" style="background:#d83a30;color:#fff;border:none;border-radius:9px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:1px;box-shadow:0 0 18px rgba(216,58,48,0.45);">点火发射</button>
    <button id="rk-reset" style="background:transparent;color:#9fb4cc;border:1px solid rgba(120,160,210,0.4);border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;">复位</button>
    <div style="display:flex;align-items:center;gap:6px;color:#8aa0bb;font-size:12px;font-family:ui-monospace,monospace;margin-left:4px;">
      回收
      <button id="rk-mode" style="background:rgba(20,40,70,0.6);color:#7fd4ff;border:1px solid rgba(90,160,230,0.4);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;">海上回收 (ASDS)</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-left:auto;color:#8aa0bb;font-size:12px;font-family:ui-monospace,monospace;">
      速度 <input id="rk-speed" type="range" min="0.5" max="3" step="0.5" value="1" style="width:96px;"> <span id="rk-speedv" style="color:#dfeaf5;">1.0x</span>
    </div>
  </div>
</div>

<script>
(function(){
  const cv = document.getElementById('rk-canvas');
  const ctx = cv.getContext('2d');
  const W = 680, H = 470;
  const el = id => document.getElementById(id);

  let mode = 'asds';      // 'asds' | 'rtls'
  let speed = 1;
  const G = 9.8;

  // booster (stage 1) state
  let S;
  function reset(){
    S = {
      t:0, phase:'standby', flagQ:false, flagMECO:false, flagSep:false,
      alt:0, vy:0, dr:0, vx:0, ang:0, targetAng:0,
      fins:0, legs:0, thr:0, f1:100,
      trail:[], engines:9,
      // stage 2
      s2:{active:false, alt:0, vy:0, dr:0, thr:0, f2:100, trail:[], sep:false},
      landed:false, lhost:false, apex:0,
      ignT:0
    };
    targetX = (mode==='rtls') ? 0 : 4200;   // meters downrange of landing site
    el('rk-launch').disabled = false;
    el('rk-launch').textContent = '点火发射';
    el('rk-launch').style.opacity = 1;
  }
  let targetX = 4200;

  function launch(){
    if(S.phase!=='standby') return;
    S.phase='ignition'; S.t=0; S.ignT=0;
    el('rk-launch').disabled = true;
    el('rk-launch').style.opacity = 0.45;
    el('rk-launch').textContent = '飞行中…';
  }

  el('rk-launch').onclick = launch;
  el('rk-reset').onclick = ()=>{ reset(); };
  el('rk-mode').onclick = ()=>{
    if(S.phase!=='standby') return;
    mode = (mode==='asds')?'rtls':'asds';
    el('rk-mode').textContent = mode==='asds' ? '海上回收 (ASDS)' : '陆上回收 (RTLS)';
    targetX = (mode==='rtls')?0:4200;
  };
  el('rk-speed').oninput = e=>{ speed=parseFloat(e.target.value); el('rk-speedv').textContent=speed.toFixed(1)+'x'; };

  // ---- physics step ----
  function step(dt){
    const p = S.phase;
    if(p==='standby'||p==='landed') return;
    S.t += dt;

    // ---------- stage 1 ----------
    if(p==='ignition'){
      S.ignT += dt; S.thr = Math.min(1, S.ignT/1.2);
      S.alt = 0; S.vy = 0;
      if(S.ignT>=1.2){ S.phase='ascent'; }
    }
    else if(p==='ascent'){
      S.thr = 1; S.f1 -= dt*4.2;
      S.targetAng = Math.min(20, S.alt/40);            // gravity turn
      const A = 24;
      S.vy += (A - G)*dt;
      S.vx += A*Math.sin(S.ang*Math.PI/180)*dt;
      if(S.vy>180 || S.f1<46){ S.phase='meco'; S.t2=0; }
    }
    else if(p==='meco'){
      S.t2 = (S.t2||0)+dt; S.thr = Math.max(0, 1 - S.t2/0.6);
      S.vy += (-G)*dt; S.fins = Math.min(1, S.t2/0.6);
      if(S.t2>=0.6 && !S.flagSep){
        S.flagSep=true; S.s2.active=true; S.s2.sep=true;
        S.s2.alt=S.alt; S.s2.vy=S.vy; S.s2.dr=S.dr; S.s2.vx=S.vx;
        S.phase='boostback'; S.t3=0;
      }
    }
    else if(p==='boostback'){
      S.t3 = (S.t3||0)+dt;
      S.fins = 1;
      S.targetAng = 150;                                // flip retrograde
      S.thr = (S.t3<2.2)?0.6:0;
      S.f1 -= (S.t3<2.2? dt*3.0 : 0);
      S.vy += (-G)*dt;
      // null out / aim downrange velocity toward target
      const need = (targetX - S.dr);
      S.vx += (Math.sign(need)* (S.t3<2.2?14:0))*dt*0.0 ; // visual only
      if(S.t3<2.6){ S.vx += (need>0? 8 : -8)*dt*(mode==='rtls'?1:0.25); }
      if(S.t3>=2.6){ S.phase='coast'; S.targetAng=180; }
    }
    else if(p==='coast'){
      S.fins = 1; S.thr = 0; S.targetAng = 180;
      S.vy += (-G)*dt;
      // gentle steer to align downrange with target
      S.vx += (targetX - S.dr>0?1:-1)*Math.min(Math.abs(targetX-S.dr),300)*0.002*dt;
      if(S.vy<0 && S.alt < S.apex*0.55 && S.alt>0){ S.phase='reentry'; S.t4=0; }
    }
    else if(p==='reentry'){
      S.t4=(S.t4||0)+dt; S.targetAng=180;
      S.thr = (S.t4<1.3)?0.75:0;
      S.f1 -= (S.t4<1.3? dt*2.2:0);
      // reentry burn slows descent a bit
      S.vy += (-G + (S.t4<1.3? 30:0))*dt;
      if(S.t4>=1.3){ S.phase='descent'; }
    }
    else if(p==='descent'){
      S.targetAng=180; S.thr=0; S.fins=1;
      S.vy += (-G)*dt;
      // suicide-burn trigger
      const amax=42, net=amax-G;
      const stop = (S.vy*S.vy)/(2*net);
      if(S.alt <= stop*1.04){ S.phase='landingburn'; }
    }
    else if(p==='landingburn'){
      S.targetAng=180;
      const amax=42, net=amax-G;
      // needed deceleration to stop at ground
      let need = (S.vy*S.vy)/(2*Math.max(S.alt,0.5));
      need = Math.min(need, net);
      S.thr = Math.min(1,(need+G)/amax);
      S.f1 -= dt*3.4;
      S.vy += (need)*dt;            // decelerate (vy negative -> toward 0)
      if(S.vy>0) S.vy=0;
      S.legs = Math.min(1, S.legs + dt*1.6);
      // glide horizontally onto pad
      S.vx += (targetX - S.dr)*0.06*dt - S.vx*0.9*dt;
      if(S.alt<=0.4){
        S.alt=0; S.vy=0; S.thr=0; S.legs=1; S.phase='landed';
        S.landed=true; S.lost = Math.abs(S.dr-targetX)>600;
      }
    }

    // integrate stage1 position
    if(p!=='ignition'){
      S.alt = Math.max(0, S.alt + S.vy*dt);
      S.dr  = S.dr + S.vx*dt;
    }
    S.apex = Math.max(S.apex, S.alt);
    // rotate toward target angle
    S.ang += (S.targetAng - S.ang)*Math.min(1, dt*3);
    // max-Q flag
    if(!S.flagQ && S.alt>180 && p==='ascent'){ S.flagQ=true; }

    // record trail (world)
    if(S.t % 0.05 < dt){ S.trail.push([S.dr,S.alt]); if(S.trail.length>400)S.trail.shift(); }

    // ---------- stage 2 ----------
    const s2=S.s2;
    if(s2.active){
      s2.thr = Math.min(1, ((S.t)-0)/1 );
      if(s2.f2>0){
        const A2=20; s2.vy += (A2-G)*dt; s2.f2 -= dt*1.4;
        s2.vx += A2*0.18*dt;
      } else { s2.vy += (-G*0.2)*dt; s2.thr=0; }
      s2.alt = Math.max(0, s2.alt + s2.vy*dt);
      s2.dr += s2.vx*dt;
      if(S.t % 0.05 < dt){ s2.trail.push([s2.dr,s2.alt]); if(s2.trail.length>400)s2.trail.shift(); }
    }
  }

  // ---- camera ----
  let cam = {cy:0, cx:0, ppm:1};
  function updateCam(){
    const visHalf = Math.min(62000, Math.max(320, S.alt*0.62 + 320));
    cam.ppm = (H*0.5)/visHalf;
    cam.cy = S.alt;            // booster centered vertically
    cam.cx = S.dr;
  }
  const sx = wx => W*0.5 + (wx-cam.cx)*cam.ppm;
  const sy = wy => H*0.5 - (wy-cam.cy)*cam.ppm;

  // ---- pre-baked starfield (world) ----
  const stars=[]; for(let i=0;i<140;i++){stars.push([(Math.random()-0.5)*180000, Math.random()*120000, Math.random()*1.4+0.3]);}
  const clouds=[]; for(let i=0;i<10;i++){clouds.push([(Math.random()-0.5)*9000, 200+Math.random()*900, 220+Math.random()*180]);}

  function skyTop(alt){
    const k = Math.min(1, alt/2400);
    const c = (a,b)=>Math.round(a+(b-a)*k);
    return `rgb(${c(40,2)},${c(120,4)},${c(200,12)})`;
  }
  function skyBot(alt){
    const k = Math.min(1, alt/2400);
    const c=(a,b)=>Math.round(a+(b-a)*k);
    return `rgb(${c(150,5)},${c(195,8)},${c(235,20)})`;
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // sky
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, skyTop(cam.cy));
    g.addColorStop(1, skyBot(cam.cy));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // stars (fade in with altitude)
    const sa = Math.min(1, cam.cy/1400);
    if(sa>0.02){
      ctx.save();
      for(const st of stars){
        const x=sx(st[0]), y=sy(st[1]);
        if(x<-5||x>W+5||y<-5||y>H+5) continue;
        ctx.globalAlpha=sa*(0.5+0.5*Math.sin((st[1]+S.t*40)*0.01));
        ctx.fillStyle='#fff'; ctx.fillRect(x,y,st[2],st[2]);
      }
      ctx.restore();
    }

    // clouds
    ctx.save();
    for(const cl of clouds){
      const x=sx(cl[0]), y=sy(cl[1]); const r=cl[2]*cam.ppm;
      if(r<1||y<-r||y>H+r) continue;
      ctx.globalAlpha=0.5*(1-Math.min(1,cam.cy/2600));
      ctx.fillStyle='#eef4fb';
      ctx.beginPath(); ctx.ellipse(x,y,r,r*0.34,0,0,7); ctx.fill();
    }
    ctx.restore();

    // ground + sea
    const gy = sy(0);
    if(gy < H+40){
      const isSea = (mode==='asds');
      ctx.fillStyle = isSea ? '#0a2236' : '#1c2a18';
      ctx.fillRect(0, gy, W, H-gy+1);
      // launch pad at world x=0
      drawPad(sx(0), gy);
      // landing target
      drawLandingSite(sx(targetX), gy, isSea);
    }

    // trails
    drawTrail(S.s2.trail, 'rgba(127,212,255,0.5)');
    drawTrail(S.trail, 'rgba(255,170,90,0.55)');

    // stage 2
    if(S.s2.active){
      const x=sx(S.s2.dr), y=sy(S.s2.alt);
      if(y>-200 && y<H+200) drawStage2(x,y, S.s2.thr);
    }

    // booster (always near center unless landed offscreen)
    if(S.phase!=='standby' || true){
      const x=sx(S.dr), y=sy(S.alt);
      drawBooster(x,y, S.ang, S.thr, S.fins, S.legs);
    }

    updateHUD();
    drawGAuge();
  }

  function drawTrail(tr, col){
    if(tr.length<2) return;
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath();
    let started=false;
    for(const p of tr){ const x=sx(p[0]),y=sy(p[1]); if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);}
    ctx.stroke(); ctx.restore();
  }

  function drawPad(x,gy){
    ctx.save();
    ctx.fillStyle='#3a3f47'; ctx.fillRect(x-26,gy,52,10);
    ctx.fillStyle='#22262c'; ctx.fillRect(x-30,gy+9,60,5);
    // tower
    ctx.strokeStyle='#5a6470'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+30,gy); ctx.lineTo(x+30,gy-44); ctx.stroke();
    ctx.restore();
  }

  function drawLandingSite(x,gy,isSea){
    ctx.save();
    if(isSea){
      // droneship
      ctx.fillStyle='#1b1f26'; ctx.fillRect(x-44,gy-6,88,12);
      ctx.fillStyle='#2a2f38'; ctx.fillRect(x-44,gy+5,88,4);
      // X target
      ctx.strokeStyle='#d8d8d8'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x-12,gy-4); ctx.lineTo(x+12,gy+2); ctx.moveTo(x+12,gy-4); ctx.lineTo(x-12,gy+2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x,gy-1,15,0,7); ctx.stroke();
    } else {
      ctx.fillStyle='#3a3f47'; ctx.fillRect(x-30,gy-2,60,8);
      ctx.strokeStyle='#d8d8d8'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,gy+1,16,0,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-11,gy-7); ctx.lineTo(x+11,gy+5); ctx.moveTo(x+11,gy-7); ctx.lineTo(x-11,gy+5); ctx.stroke();
    }
    ctx.restore();
  }

  function flame(ctx, w, len, intensity){
    if(intensity<=0.02) return;
    const L = len*(0.7+0.6*intensity)*(0.85+0.15*Math.sin(S.t*40));
    const grd=ctx.createLinearGradient(0,0,0,L);
    grd.addColorStop(0,'rgba(180,220,255,0.95)');
    grd.addColorStop(0.4,'rgba(120,180,255,0.85)');
    grd.addColorStop(1,'rgba(255,150,40,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.moveTo(-w*0.5,0); ctx.lineTo(w*0.5,0);
    ctx.lineTo(w*0.18,L*0.55); ctx.lineTo(0,L); ctx.lineTo(-w*0.18,L*0.55);
    ctx.closePath(); ctx.fill();
  }

  function drawBooster(cx,cy,ang,thr,fins,legs){
    const ph = Math.max(34, Math.min(150, 42*cam.ppm)); // pixel height
    const pw = ph*0.135;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(ang*Math.PI/180);
    // body local: +y down (engine), -y up (top). draw centered.
    const top=-ph/2, bot=ph/2;
    // engine flame (at bottom)
    ctx.save(); ctx.translate(0,bot); flame(ctx, pw*1.4, ph*1.5, thr); ctx.restore();
    // landing legs
    if(legs>0){
      ctx.strokeStyle='#cfd6dd'; ctx.lineWidth=Math.max(1.4,pw*0.16);
      const sp = legs*ph*0.32;
      [-1,1].forEach(s=>{
        ctx.beginPath(); ctx.moveTo(s*pw*0.5, bot-ph*0.05);
        ctx.lineTo(s*(pw*0.5+sp), bot+ph*0.06); ctx.stroke();
      });
    }
    // body
    ctx.fillStyle='#eef1f4'; ctx.fillRect(-pw/2, top, pw, ph);
    // interstage (black top band)
    ctx.fillStyle='#15171b'; ctx.fillRect(-pw/2, top, pw, ph*0.1);
    // engine section
    ctx.fillStyle='#23262b'; ctx.fillRect(-pw/2, bot-ph*0.06, pw, ph*0.06);
    // grid fins (near top)
    if(fins>0){
      ctx.fillStyle='#9aa2ab';
      const fw=pw*0.55*fins, fh=ph*0.09;
      ctx.fillRect(-pw/2-fw, top+ph*0.12, fw, fh);
      ctx.fillRect(pw/2, top+ph*0.12, fw, fh);
    }
    // detail lines
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(0,top); ctx.lineTo(0,bot); ctx.stroke();
    // SpaceX-ish marking
    ctx.fillStyle='#1a1c20'; ctx.fillRect(-pw/2, top+ph*0.3, pw, ph*0.015);
    ctx.restore();
  }

  function drawStage2(cx,cy,thr){
    const ph=Math.max(20,Math.min(70,16*cam.ppm)); const pw=ph*0.17;
    ctx.save(); ctx.translate(cx,cy);
    ctx.save(); ctx.translate(0,ph/2); flame(ctx, pw*1.1, ph*1.2, thr); ctx.restore();
    // fairing/payload nose
    ctx.fillStyle='#eef1f4';
    ctx.beginPath();
    ctx.moveTo(-pw/2,ph/2); ctx.lineTo(pw/2,ph/2); ctx.lineTo(pw/2,-ph*0.15);
    ctx.quadraticCurveTo(0,-ph*0.6, -pw/2,-ph*0.15); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#23262b'; ctx.fillRect(-pw/2,ph/2-ph*0.06,pw,ph*0.06);
    ctx.restore();
  }

  // ---- HUD ----
  const phaseNames = {
    standby:'待命 · STANDBY', ignition:'点火 · IGNITION', ascent:'上升 · ASCENT',
    meco:'主发动机关机 · MECO', boostback:'返场点火 · BOOSTBACK',
    coast:'滑行 · COAST', reentry:'再入点火 · RE-ENTRY',
    descent:'下降 · DESCENT', landingburn:'着陆点火 · LANDING BURN',
    landed:'已着陆 · TOUCHDOWN'
  };
  function fmtClock(){
    if(S.phase==='standby') return 'T- 00:03';
    const mt = S.t*7; // scaled mission seconds
    const m=Math.floor(mt/60), s=Math.floor(mt%60);
    return 'T+ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function updateHUD(){
    let label = phaseNames[S.phase]||S.phase;
    if(S.flagQ && S.phase==='ascent' && S.alt<420) label='最大动压 · MAX-Q';
    if(S.phase==='landed') label = S.lost ? '着陆偏离 · RUD' : '助推器已回收 · LANDED';
    el('rk-phase').textContent = label;
    el('rk-phase').style.color = S.phase==='landed' ? (S.lost?'#ff8a7f':'#7fffb0') : '#7fd4ff';
    el('rk-clock').textContent = fmtClock();

    const altkm = S.alt/1000*66;
    const vmag = Math.sqrt(S.vy*S.vy+S.vx*S.vx)*50.4;
    el('rk-alt').innerHTML = altkm.toFixed(1)+'<span style="font-size:9px;color:#6f87a3"> km</span>';
    el('rk-vel').innerHTML = Math.round(vmag).toLocaleString()+'<span style="font-size:9px;color:#6f87a3"> km/h</span>';
    el('rk-dr').innerHTML  = (Math.abs(S.dr)/1000*66).toFixed(1)+'<span style="font-size:9px;color:#6f87a3"> km</span>';

    const f1=Math.max(0,S.f1), f2=Math.max(0,S.s2.f2);
    el('rk-f1').style.width=f1+'%'; el('rk-f1t').textContent=Math.round(f1)+'%';
    el('rk-f2').style.width=f2+'%'; el('rk-f2t').textContent=Math.round(f2)+'%';
  }
  function drawGAuge(){}

  // ---- loop ----
  let last=performance.now();
  function frame(now){
    let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
    const sdt = dt*speed*1.0;
    // sub-step for stability
    const n=3; for(let i=0;i<n;i++) step(sdt/n);
    updateCam(); draw();
    requestAnimationFrame(frame);
  }
  reset(); updateCam(); requestAnimationFrame(frame);
})();
</script>
